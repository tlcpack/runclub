<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighborhood Run Club Leaderboard</title>

    <!-- Grid.js styling -->
    <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />

    <style>
        :root { --accent: #e8590c; --bg: #f7f6f3; --card: #fff; --muted: #6b6b6b; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 2rem 1rem; background: var(--bg); color: #222;
        }
        .container {
            max-width: 820px; margin: 0 auto; background: var(--card);
            padding: 2rem; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }
        h1 { margin: 0 0 0.25rem; font-size: 1.8rem; }
        .subtitle { color: var(--muted); margin: 0 0 1.5rem; }
        .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
        .tab {
            border: 1px solid #ddd; background: #fff; color: #444;
            padding: 0.45rem 0.95rem; border-radius: 999px; cursor: pointer;
            font-size: 0.95rem; transition: all 0.15s;
        }
        .tab:hover { border-color: var(--accent); }
        .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .controls { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; }
        .controls label { color: var(--muted); font-size: 0.9rem; }
        select {
            font-size: 0.95rem; padding: 0.4rem 0.6rem; border: 1px solid #ddd;
            border-radius: 8px; background: #fff; color: #333; cursor: pointer;
        }
        #status { color: var(--muted); padding: 1rem 0; }
        .gridjs-wrapper { box-shadow: none !important; }
        footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 1.5rem; }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃 Neighborhood Run Club</h1>
        <p class="subtitle">Weekly times and leaderboards for our neighborhood runners.</p>

        <div class="tabs" id="tabs"></div>
        <div class="controls">
            <label for="date-filter">Showing</label>
            <select id="date-filter"></select>
        </div>
        <div id="status">Loading times…</div>
        <div id="table-wrapper"></div>

        <footer>Times update within a few minutes of being entered in the club spreadsheet.</footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
    <script>
        // Reads each distance tab of the club workbook via the gviz CSV
        // endpoint (CORS-enabled). The workbook must be shared as
        // "Anyone with the link > Viewer".
        // Tabs are wide-format, one row per runner:
        //   Bib No., Runner, Week 1 (07/08/26), Week 2 ... Week 8, Personal Best, Improvement
        // Only the distance tabs are fetched — the Master Roster tab holds
        // parent contact info and must never be loaded here.
        const SHEET_ID = '1F4maKMDDvPjXqvpW65AFTvzTYMAc-qFr';
        const csvUrl = (sheet) =>
            'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
            '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(sheet);

        // Tab name -> length in meters, used to compute pace per mile.
        const DISTANCES = {
            '100m': 100,
            '400m': 400,
            '800m': 800,
            '1 Mile': 1609.34,
        };
        const MILE_METERS = 1609.34;

        // Times are entered inconsistently, so parse by shape:
        //   "1:57:19"  -> minutes:seconds:hundredths (1:57.19)
        //   "5:42.0"   -> minutes:seconds
        //   "13.91"    -> plain seconds on sprints (under 800m)
        //   "8.19", "4" on 800m / 1 Mile -> minutes.seconds shorthand (8:19, 4:00)
        function parseTime(raw, meters) {
            if (raw == null) return NaN;
            const str = String(raw).trim();
            if (str === '') return NaN;
            if (str.includes(':')) {
                const parts = str.split(':').map(Number);
                if (parts.some(isNaN)) return NaN;
                let total = NaN;
                if (parts.length === 2) total = parts[0] * 60 + parts[1];
                if (parts.length === 3) total = parts[0] * 60 + parts[1] + parts[2] / 100;
                return total > 0 ? total : NaN;
            }
            const n = Number(str);
            if (isNaN(n) || n <= 0) return NaN;
            if (meters < 800) return n;
            const [min, sec = '0'] = str.split('.');
            return Number(min) * 60 + Number(sec.padEnd(2, '0').slice(0, 2));
        }

        // seconds -> "1:05.2" (drops minutes when under a minute)
        function formatTime(s) {
            if (!isFinite(s)) return '—';
            const m = Math.floor(s / 60);
            const rem = s - m * 60;
            if (m === 0) return rem.toFixed(1);
            return m + ':' + rem.toFixed(1).padStart(4, '0');
        }

        // pace per mile, "m:ss /mi"
        function formatPace(seconds, meters) {
            if (!isFinite(seconds) || !meters) return '—';
            const perMile = seconds * (MILE_METERS / meters);
            const m = Math.floor(perMile / 60);
            const sec = Math.round(perMile - m * 60);
            return m + ':' + String(sec).padStart(2, '0') + ' /mi';
        }

        const ALL_TIME = '__all__';

        let grid = null;
        let recordsByDistance = {};
        let weeks = []; // weeks that have at least one time, latest first: [{num, date}]
        let activeDistance = Object.keys(DISTANCES)[0];
        let activeWeek = ALL_TIME;

        // Reduce a distance's records to one row per runner (their best time),
        // optionally restricted to a single week.
        function bestPerRunner(records, week) {
            const best = new Map();
            records.forEach((r) => {
                if (week !== ALL_TIME && String(r.week) !== week) return;
                const existing = best.get(r.name);
                if (!existing || r.seconds < existing.seconds) best.set(r.name, r);
            });
            return [...best.values()];
        }

        function renderTable() {
            const meters = DISTANCES[activeDistance];
            const rows = bestPerRunner(recordsByDistance[activeDistance] || [], activeWeek)
                .sort((a, b) => a.seconds - b.seconds)
                .map((r, i) => [
                    i + 1,                                  // rank (default time-sorted)
                    r.name,
                    r.seconds,                              // sorts numerically, displayed via formatter
                    formatPace(r.seconds, meters),
                ]);

            const config = {
                columns: [
                    { name: '#', width: '50px', sort: false },
                    { name: 'Runner' },
                    { name: 'Time', formatter: (cell) => formatTime(cell) },
                    { name: 'Pace', sort: false },
                ],
                data: rows,
                search: true,
                sort: true,
                language: {
                    search: { placeholder: 'Search runner…' },
                    noRecordsFound: 'No times recorded for this distance yet.',
                },
            };

            if (grid) {
                grid.updateConfig(config).forceRender();
            } else {
                grid = new gridjs.Grid(config);
                grid.render(document.getElementById('table-wrapper'));
            }
        }

        function buildWeekFilter() {
            const sel = document.getElementById('date-filter');
            sel.innerHTML = '';
            const opts = [
                ['All-time best', ALL_TIME],
                ...weeks.map((w) => ['Week ' + w.num + (w.date ? ' · ' + w.date : ''), String(w.num)]),
            ];
            opts.forEach(([label, value]) => {
                const o = document.createElement('option');
                o.value = value;
                o.textContent = label;
                sel.appendChild(o);
            });
            sel.value = activeWeek;
            sel.onchange = () => {
                activeWeek = sel.value;
                renderTable();
            };
        }

        function buildTabs() {
            const tabsEl = document.getElementById('tabs');
            tabsEl.innerHTML = '';
            Object.keys(DISTANCES).forEach((dist) => {
                const btn = document.createElement('button');
                btn.className = 'tab' + (dist === activeDistance ? ' active' : '');
                btn.textContent = dist;
                btn.onclick = () => {
                    activeDistance = dist;
                    document.querySelectorAll('.tab').forEach((t) =>
                        t.classList.toggle('active', t.textContent === dist));
                    renderTable();
                };
                tabsEl.appendChild(btn);
            });
        }

        // Turn one distance tab's CSV into records: {name, week, weekDate, seconds}.
        // Week columns are found by header ("Week 3", "Week 1 (07/08/26)");
        // Personal Best / Improvement are recomputed here, not read.
        function parseTab(csv, meters) {
            const rows = Papa.parse(csv, { skipEmptyLines: true }).data;
            if (!rows.length) return [];
            const header = rows[0].map((h) => String(h).trim());
            const nameIdx = header.indexOf('Runner');
            const weekCols = [];
            header.forEach((h, i) => {
                const m = h.match(/^Week\s*(\d+)(?:\s*\((.*?)\))?/i);
                if (m) weekCols.push({ idx: i, num: Number(m[1]), date: m[2] || '' });
            });
            if (nameIdx === -1 || !weekCols.length) return [];

            const records = [];
            rows.slice(1).forEach((row) => {
                const name = String(row[nameIdx] || '').trim();
                if (!name) return;
                weekCols.forEach((w) => {
                    const seconds = parseTime(row[w.idx], meters);
                    if (!isFinite(seconds)) return;
                    records.push({ name, week: w.num, weekDate: w.date, seconds });
                });
            });
            return records;
        }

        async function init() {
            try {
                const names = Object.keys(DISTANCES);
                const csvs = await Promise.all(names.map(async (n) => {
                    const res = await fetch(csvUrl(n));
                    if (!res.ok) throw new Error('HTTP ' + res.status + ' loading ' + n);
                    return res.text();
                }));

                recordsByDistance = {};
                const weekMap = new Map(); // week number -> date label (if any tab has one)
                names.forEach((n, i) => {
                    const records = parseTab(csvs[i], DISTANCES[n]);
                    recordsByDistance[n] = records;
                    records.forEach((r) => {
                        if (!weekMap.has(r.week) || (r.weekDate && !weekMap.get(r.week))) {
                            weekMap.set(r.week, r.weekDate);
                        }
                    });
                });

                weeks = [...weekMap.entries()]
                    .map(([num, date]) => ({ num, date }))
                    .sort((a, b) => b.num - a.num);

                document.getElementById('status').textContent = '';
                buildTabs();
                buildWeekFilter();
                renderTable();
            } catch (err) {
                console.error('Error loading run data:', err);
                document.getElementById('status').textContent =
                    'Failed to load leaderboard. Please try again later.';
            }
        }

        init();
    </script>
</body>
</html>
