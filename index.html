<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighborhood Run Club Leaderboard</title>

    <!-- Grid.js styling -->
    <link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />

    <style>
        :root { --accent: #e8590c; --bg: #f7f6f3; --card: #fff; --muted: #6b6b6b; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 2rem 1rem; background: var(--bg); color: #222;
        }
        .container {
            max-width: 820px; margin: 0 auto; background: var(--card);
            padding: 2rem; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }
        h1 { margin: 0 0 0.25rem; font-size: 1.8rem; }
        .subtitle { color: var(--muted); margin: 0 0 1.5rem; }
        .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
        .tab {
            border: 1px solid #ddd; background: #fff; color: #444;
            padding: 0.45rem 0.95rem; border-radius: 999px; cursor: pointer;
            font-size: 0.95rem; transition: all 0.15s;
        }
        .tab:hover { border-color: var(--accent); }
        .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .controls { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; }
        .controls label { color: var(--muted); font-size: 0.9rem; }
        select {
            font-size: 0.95rem; padding: 0.4rem 0.6rem; border: 1px solid #ddd;
            border-radius: 8px; background: #fff; color: #333; cursor: pointer;
        }
        #status { color: var(--muted); padding: 1rem 0; }
        .gridjs-wrapper { box-shadow: none !important; }
        footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 1.5rem; }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃 Neighborhood Run Club</h1>
        <p class="subtitle">Weekly times and leaderboards for our neighborhood runners.</p>

        <div class="tabs" id="tabs"></div>
        <div class="controls">
            <label for="date-filter">Showing</label>
            <select id="date-filter"></select>
        </div>
        <div id="status">Loading times…</div>
        <div id="table-wrapper"></div>

        <footer>Times update within a few minutes of being entered in the club spreadsheet.</footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
    <script>
        // Reads the sheet's CSV export endpoint directly (CORS-enabled).
        // The sheet must be shared as "Anyone with the link > Viewer".
        // URL shape: .../spreadsheets/d/<SHEET_ID>/export?format=csv&gid=<TAB_GID>
        // Expected columns (header row): Name, Date, Distance, Time
        //   Distance: one of 100m, 200m, 400m, 1 mi
        //   Time:     seconds ("13.4") or minutes:seconds ("5:42.0")
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/1IFA5fZaxw9pS1RcAFGCAyYFpBnNnUmIeQVA9MDxnzPM/export?format=csv&gid=0';

        // Distance label -> length in meters, used to compute pace per mile.
        const DISTANCES = {
            '100m': 100,
            '200m': 200,
            '400m': 400,
            '1 mi': 1609.34,
        };
        const MILE_METERS = 1609.34;

        // "13.4" -> 13.4 ; "5:42.0" -> 342 ; returns NaN if unparseable.
        function parseTime(raw) {
            if (raw == null) return NaN;
            const str = String(raw).trim();
            if (str === '') return NaN;
            const parts = str.split(':').map(Number);
            if (parts.some(isNaN) || parts.length === 0 || parts.length > 2) return NaN;
            const total = parts.length === 2 ? parts[0] * 60 + parts[1] : parts[0];
            return total > 0 ? total : NaN;
        }

        // seconds -> "1:05.2" (drops minutes when under a minute)
        function formatTime(s) {
            if (!isFinite(s)) return '—';
            const m = Math.floor(s / 60);
            const rem = s - m * 60;
            if (m === 0) return rem.toFixed(1);
            return m + ':' + rem.toFixed(1).padStart(4, '0');
        }

        // pace per mile, "m:ss /mi"
        function formatPace(seconds, meters) {
            if (!isFinite(seconds) || !meters) return '—';
            const perMile = seconds * (MILE_METERS / meters);
            const m = Math.floor(perMile / 60);
            const sec = Math.round(perMile - m * 60);
            return m + ':' + String(sec).padStart(2, '0') + ' /mi';
        }

        const ALL_TIME = '__all__';

        let grid = null;
        let recordsByDistance = {};
        let allDates = [];
        let activeDistance = Object.keys(DISTANCES)[0];
        let activeDate = ALL_TIME;

        // Reduce a distance's records to one row per runner (their best time),
        // optionally restricted to a single date.
        function bestPerRunner(records, date) {
            const best = new Map();
            records.forEach((r) => {
                if (date !== ALL_TIME && r.date !== date) return;
                const existing = best.get(r.name);
                if (!existing || r.seconds < existing.seconds) best.set(r.name, r);
            });
            return [...best.values()];
        }

        function renderTable() {
            const meters = DISTANCES[activeDistance];
            const rows = bestPerRunner(recordsByDistance[activeDistance] || [], activeDate)
                .sort((a, b) => a.seconds - b.seconds)
                .map((r, i) => [
                    i + 1,                                  // rank (default time-sorted)
                    r.name,
                    r.seconds,                              // sorts numerically, displayed via formatter
                    formatPace(r.seconds, meters),
                ]);

            const config = {
                columns: [
                    { name: '#', width: '50px', sort: false },
                    { name: 'Runner' },
                    { name: 'Time', formatter: (cell) => formatTime(cell) },
                    { name: 'Pace', sort: false },
                ],
                data: rows,
                search: true,
                sort: true,
                pagination: { limit: 15 },
                language: {
                    search: { placeholder: 'Search runner…' },
                    noRecordsFound: 'No times recorded for this distance yet.',
                },
            };

            if (grid) {
                grid.updateConfig(config).forceRender();
            } else {
                grid = new gridjs.Grid(config);
                grid.render(document.getElementById('table-wrapper'));
            }
        }

        function buildDateFilter() {
            const sel = document.getElementById('date-filter');
            sel.innerHTML = '';
            const opts = [['All-time best', ALL_TIME], ...allDates.map((d) => [d, d])];
            opts.forEach(([label, value]) => {
                const o = document.createElement('option');
                o.value = value;
                o.textContent = label;
                sel.appendChild(o);
            });
            sel.value = activeDate;
            sel.onchange = () => {
                activeDate = sel.value;
                renderTable();
            };
        }

        function buildTabs() {
            const tabsEl = document.getElementById('tabs');
            tabsEl.innerHTML = '';
            Object.keys(DISTANCES).forEach((dist) => {
                const btn = document.createElement('button');
                btn.className = 'tab' + (dist === activeDistance ? ' active' : '');
                btn.textContent = dist;
                btn.onclick = () => {
                    activeDistance = dist;
                    document.querySelectorAll('.tab').forEach((t) =>
                        t.classList.toggle('active', t.textContent === dist));
                    renderTable();
                };
                tabsEl.appendChild(btn);
            });
        }

        async function init() {
            if (CSV_URL.startsWith('PASTE_')) {
                document.getElementById('status').textContent =
                    'Set CSV_URL in index.html to your published Google Sheet CSV link.';
                return;
            }
            try {
                const res = await fetch(CSV_URL);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const csv = await res.text();

                const parsed = Papa.parse(csv, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: (h) => h.trim(),
                });

                recordsByDistance = {};
                Object.keys(DISTANCES).forEach((d) => (recordsByDistance[d] = []));
                const dateSet = new Set();

                parsed.data.forEach((row) => {
                    const dist = (row.Distance || '').trim();
                    const seconds = parseTime(row.Time);
                    if (!DISTANCES[dist] || !isFinite(seconds)) return;
                    const date = (row.Date || '').trim();
                    if (date) dateSet.add(date);
                    recordsByDistance[dist].push({
                        name: (row.Name || '').trim(),
                        date,
                        seconds,
                    });
                });

                // Most recent first; falls back to string order for non-ISO dates.
                allDates = [...dateSet].sort((a, b) => {
                    const ta = Date.parse(a), tb = Date.parse(b);
                    if (isNaN(ta) || isNaN(tb)) return a < b ? 1 : -1;
                    return tb - ta;
                });

                document.getElementById('status').textContent = '';
                buildTabs();
                buildDateFilter();
                renderTable();
            } catch (err) {
                console.error('Error loading run data:', err);
                document.getElementById('status').textContent =
                    'Failed to load leaderboard. Please try again later.';
            }
        }

        init();
    </script>
</body>
</html>
